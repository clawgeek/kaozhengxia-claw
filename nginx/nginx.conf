worker_processes auto;
worker_rlimit_nofile 65535;

events {
  worker_connections 8192;
  multi_accept on;
  use epoll;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile           on;
  tcp_nopush         on;
  tcp_nodelay        on;
  keepalive_timeout  65;
  keepalive_requests 1000;
  server_tokens      off;
  client_max_body_size 2m;

  gzip              on;
  gzip_vary         on;
  gzip_comp_level   5;
  gzip_min_length   1024;
  gzip_types        text/plain text/css application/json application/javascript application/xml image/svg+xml;

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                  'rt=$request_time urt=$upstream_response_time ua="$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  # 边缘限流，作为 API 进程内限流之前的第一道闸
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=40r/s;

  upstream claw_api {
    least_conn;
    server api1:8080 max_fails=3 fail_timeout=10s;
    server api2:8080 max_fails=3 fail_timeout=10s;
    server api3:8080 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }

  server {
    listen 80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # 健康检查直通 API
    location = /healthz {
      access_log off;
      proxy_pass http://claw_api;
    }

    location /api/ {
      limit_req zone=api_limit burst=80 nodelay;

      proxy_pass http://claw_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;

      proxy_connect_timeout 3s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      proxy_buffering on;
      proxy_buffers 16 16k;

      # 单个副本异常时自动切换
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      proxy_next_upstream_timeout 8s;
    }

    location = /admin {
      try_files /admin/index.html =404;
      add_header Cache-Control "no-cache";
    }

    location /admin/ {
      try_files $uri $uri/ /admin/index.html;
      add_header Cache-Control "no-cache";
    }

    location = /index.html {
      add_header Cache-Control "no-cache";
    }

    location / {
      try_files $uri $uri/ /index.html;
      expires 1h;
      add_header Cache-Control "public, max-age=3600";
    }
  }
}
