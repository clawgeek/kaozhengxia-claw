apiVersion: v1
kind: ConfigMap
metadata:
  name: claw-config
  labels:
    app: claw-api
data:
  NODE_ENV: "production"
  PORT: "8080"
  WEB_ROOT: "/app/web"
  TRUST_PROXY: "true"
  PG_POOL_MAX: "20"
  RATE_LIMIT_MAX: "180"
  RATE_LIMIT_WINDOW_MS: "60000"
  CORS_ORIGINS: "*"
  ADMIN_PHONE: "13354281998"
  ADMIN_NAME: "桑杰逊"
---
# 示例 Secret：真实部署请用 kubectl create secret / External Secrets / Sealed Secrets
# 下面的 base64 只是占位，务必替换
apiVersion: v1
kind: Secret
metadata:
  name: claw-secret
  labels:
    app: claw-api
type: Opaque
stringData:
  DATABASE_URL: "postgres://claw:CHANGE_ME@postgres.example.internal:5432/claw?sslmode=require"
  REDIS_URL: "redis://redis.example.internal:6379/0"
  JWT_SECRET: "CHANGE_ME_TO_A_LONG_RANDOM_SECRET"
  ADMIN_PASSWORD: "CHANGE_ME"
