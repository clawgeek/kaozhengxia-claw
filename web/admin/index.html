<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 · 考证虾Claw</title>
<style>
:root{
  --paper:#FAF5EB;--card:#FFFFFF;--ink:#1A1A1A;--muted:#5C5448;--line:#E5DDC8;--line2:#CFC4A8;
  --red:#C53A2A;--dark:#1A1A1A;--dark2:#222222;--dark-line:#3A3A3A;--dark-text:#A8A096;
  --green:#2F7D5A;--radius:3px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei UI","Microsoft YaHei","Hiragino Sans GB",sans-serif;font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
.mono{font-family:Consolas,"SF Mono","JetBrains Mono",monospace}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit;font-size:13.5px;color:var(--ink)}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}

/* 登录 */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line2);border-radius:4px;padding:36px 32px}
.login .brand{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.login .logo{width:34px;height:34px;background:var(--red);border-radius:2px;display:flex;align-items:center;justify-content:center;color:#FAF5EB;font-weight:800;font-size:16px}
.login h1{font-size:20px;font-weight:800;letter-spacing:.4px}
.login .kicker{font-size:10.5px;letter-spacing:1.6px;color:var(--red);font-weight:700;margin-bottom:8px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.field input{width:100%;padding:11px 13px;border:1px solid var(--line2);border-radius:2px;background:var(--paper)}
.field input:focus{outline:none;border-color:var(--ink);background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border-radius:2px;font-size:13.5px;font-weight:600;transition:all .16s;border:1px solid transparent;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn-dark{background:var(--ink);color:var(--paper)}
.btn-red{background:var(--red);color:#fff}
.btn-ghost{border-color:var(--ink);color:var(--ink);background:transparent}
.btn-ghost:hover{background:var(--ink);color:var(--paper)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.err{font-size:12px;color:var(--red);min-height:18px;margin-bottom:6px}
.hint{font-size:11px;color:var(--muted);margin-top:14px;text-align:center;line-height:1.8}

/* 应用框架 */
.app{display:grid;grid-template-columns:206px 1fr;min-height:100vh}
.side{background:var(--dark);color:var(--paper);padding:22px 0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.side .brand{display:flex;align-items:center;gap:9px;padding:0 20px 22px}
.side .logo{width:28px;height:28px;background:var(--red);border-radius:2px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff}
.side .name{font-size:15px;font-weight:800;letter-spacing:.4px}
.side .tag{font-size:10px;color:var(--dark-text);letter-spacing:1.2px;margin-top:2px}
.nav{padding:0 10px}
.nav button{display:flex;align-items:center;gap:9px;width:100%;padding:10px 12px;border-radius:2px;color:var(--dark-text);font-size:13px;text-align:left;transition:all .15s}
.nav button:hover{background:#262626;color:var(--paper)}
.nav button.on{background:var(--red);color:#fff;font-weight:600}
.nav .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7}
.side-foot{margin-top:auto;padding:16px 20px;border-top:1px solid var(--dark-line);font-size:11px;color:var(--dark-text)}
.side-foot a{color:var(--red)}

.main{min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 30px;background:rgba(250,245,235,.95);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;backdrop-filter:blur(8px)}
.top h2{font-size:19px;font-weight:800;letter-spacing:.3px}
.top .who{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--muted)}
.top .who b{color:var(--ink)}
.content{padding:26px 30px 70px}

/* 概览 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:18px 20px}
.stat .k{font-size:11px;color:var(--muted);letter-spacing:.8px}
.stat .v{font-size:26px;font-weight:800;letter-spacing:.4px;margin-top:6px;line-height:1.2}
.stat .s{font-size:11px;color:var(--muted);margin-top:4px}
.stat.hi{background:var(--dark);border-color:var(--dark);color:var(--paper)}
.stat.hi .k,.stat.hi .s{color:var(--dark-text)}
.stat.hi .v{color:var(--paper)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:3px;margin-bottom:22px;overflow:hidden}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:#FBF8F1}
.panel-head .t{font-size:13.5px;font-weight:800;letter-spacing:.3px}
.panel-head .m{font-size:11.5px;color:var(--muted)}
.panel-body{padding:18px 20px}

/* 柱状图 */
.chart{display:flex;align-items:flex-end;gap:8px;height:128px;padding-top:8px}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;min-width:0}
.chart .bar{width:100%;max-width:26px;background:var(--red);border-radius:2px 2px 0 0;opacity:.85;min-height:2px;transition:height .4s}
.chart .col:hover .bar{opacity:1}
.chart .d{font-size:9.5px;color:var(--muted);white-space:nowrap}
.chart .val{font-size:9px;color:var(--muted)}

/* 表格 */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.6px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid #F2EDE1;font-size:12.5px;vertical-align:middle}
tbody tr:hover{background:#FCFAF4}
tbody tr:last-child td{border-bottom:none}
.thumb{font-weight:600;line-height:1.5}
.sub{font-size:11px;color:var(--muted);margin-top:2px}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
.tag.paid{background:#E7F2EC;color:var(--green)}
.tag.pending{background:#FBF0DC;color:#8A6116}
.tag.refunded{background:#F3E6E3;color:var(--red)}
.tag.cert{background:#EFEAE0;color:var(--muted)}
.tag.career{background:#E9EDF5;color:#3C567F}
.money{font-weight:700;letter-spacing:.3px}
.muted{color:var(--muted)}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line);background:#FBF8F1}
.toolbar input,.toolbar select{padding:8px 11px;border:1px solid var(--line2);border-radius:2px;background:var(--card);min-width:0}
.toolbar input{flex:1;min-width:180px}
.toolbar input:focus,.toolbar select:focus{outline:none;border-color:var(--ink)}
.count{font-size:11.5px;color:var(--muted);white-space:nowrap}

.pager{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.pager .btns{display:flex;gap:8px}
.pager button{padding:5px 12px;border:1px solid var(--line2);border-radius:2px;font-size:12px;background:var(--card)}
.pager button:hover{border-color:var(--ink)}
.pager button[disabled]{opacity:.4;cursor:not-allowed}

.price-input{width:88px;padding:6px 8px;border:1px solid var(--line2);border-radius:2px;text-align:right}
.price-input:focus{outline:none;border-color:var(--ink)}
.switch{position:relative;display:inline-block;width:38px;height:20px;vertical-align:middle}
.switch input{display:none}
.switch i{position:absolute;inset:0;background:#D8CFBC;border-radius:999px;transition:.18s;cursor:pointer}
.switch i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.18s}
.switch input:checked + i{background:var(--green)}
.switch input:checked + i::after{transform:translateX(18px)}

.empty{padding:44px 20px;text-align:center;color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,16px);background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:3px;font-size:13px;opacity:0;pointer-events:none;transition:.22s;z-index:900;max-width:80vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.loading{padding:34px;text-align:center;color:var(--muted);font-size:12.5px}

@media (max-width:1024px){.stats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;padding:14px 0}
  .side .brand{padding-bottom:12px}
  .nav{display:flex;gap:6px;padding:0 12px 8px;overflow:auto}
  .nav button{width:auto;white-space:nowrap;padding:8px 12px}
  .side-foot{display:none}
  .content{padding:18px}
  .top{padding:14px 18px}
  .stats{grid-template-columns:1fr 1fr}
  .hide-sm{display:none}
}
</style>
</head>
<body>

<!-- 登录 -->
<div class="login-wrap" id="loginView">
  <form class="login" id="loginForm">
    <div class="brand"><div class="logo">虾</div><div><div class="kicker mono">ADMIN CONSOLE</div><h1>管理后台</h1></div></div>
    <div class="field"><label>管理员手机号</label><input type="tel" name="phone" inputmode="numeric" maxlength="11" placeholder="11 位手机号" autocomplete="username"></div>
    <div class="field"><label>密码</label><input type="password" name="password" placeholder="管理员密码" autocomplete="current-password"></div>
    <div class="err" id="loginErr"></div>
    <button class="btn btn-dark" type="submit" style="width:100%" id="loginBtn">登录</button>
    <div class="hint">仅管理员账号可进入。默认账号由服务端 <span class="mono">ADMIN_PHONE / ADMIN_PASSWORD</span> 配置。<br><a href="/" style="color:var(--red)">← 返回前台</a></div>
  </form>
</div>

<!-- 应用 -->
<div class="app" id="appView" hidden>
  <aside class="side">
    <div class="brand"><div class="logo">虾</div><div><div class="name">考证虾 Claw</div><div class="tag mono">ADMIN CONSOLE</div></div></div>
    <nav class="nav" id="nav">
      <button data-view="overview" class="on"><span class="dot"></span>经营概览</button>
      <button data-view="orders"><span class="dot"></span>订单管理</button>
      <button data-view="users"><span class="dot"></span>学员管理</button>
      <button data-view="courses"><span class="dot"></span>课程管理</button>
    </nav>
    <div class="side-foot">作者 桑杰逊 · <a href="/" target="_blank">前台首页</a></div>
  </aside>

  <div class="main">
    <div class="top">
      <h2 id="viewTitle">经营概览</h2>
      <div class="who"><span>管理员 <b id="adminName">—</b></span><button class="btn btn-ghost btn-sm" id="logoutBtn">退出</button></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const TOKEN_KEY = 'claw_admin_token';
const S = { token: localStorage.getItem(TOKEN_KEY) || '', admin: null, view: 'overview', pages: {} };

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function money(n){ return '¥' + Number(n || 0).toLocaleString('zh-CN'); }
function dt(ms){ if(!ms) return '—'; const d = new Date(Number(ms)); return d.toLocaleString('zh-CN', { hour12: false }); }
function shortDate(ms){ if(!ms) return '—'; return new Date(Number(ms)).toLocaleString('zh-CN', { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hour12:false }); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2600);
}

async function api(path, opts = {}){
  const { method = 'GET', body, auth = true } = opts;
  const headers = { 'content-type': 'application/json' };
  if (auth && S.token) headers.authorization = 'Bearer ' + S.token;
  const res = await fetch('/api' + path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  let data = null; try { data = await res.json(); } catch { data = null; }
  if (!res.ok) {
    if (res.status === 401) { logout(); }
    throw new Error((data && data.error) || ('请求失败 ' + res.status));
  }
  return data;
}

function logout(){
  S.token = ''; S.admin = null;
  localStorage.removeItem(TOKEN_KEY);
  document.getElementById('appView').hidden = true;
  document.getElementById('loginView').hidden = false;
}

/* ---------- 登录 ---------- */
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const err = document.getElementById('loginErr');
  const btn = document.getElementById('loginBtn');
  err.textContent = '';
  btn.disabled = true;
  try {
    const data = await api('/auth/login', { method: 'POST', auth: false, body: { phone: f.elements.phone.value, password: f.elements.password.value } });
    if (!data.user || data.user.role !== 'admin') throw new Error('该账号不是管理员，无法进入后台');
    S.token = data.token; S.admin = data.user;
    localStorage.setItem(TOKEN_KEY, data.token);
    enterApp();
  } catch (ex) {
    err.textContent = ex.message;
  } finally {
    btn.disabled = false;
  }
});

function enterApp(){
  document.getElementById('loginView').hidden = true;
  document.getElementById('appView').hidden = false;
  document.getElementById('adminName').textContent = S.admin ? S.admin.name : '管理员';
  render();
}

document.getElementById('logoutBtn').addEventListener('click', logout);

document.getElementById('nav').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-view]');
  if (!btn) return;
  S.view = btn.dataset.view;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b === btn));
  const titles = { overview: '经营概览', orders: '订单管理', users: '学员管理', courses: '课程管理' };
  document.getElementById('viewTitle').textContent = titles[S.view];
  render();
});

async function render(){
  const content = document.getElementById('content');
  content.innerHTML = '<div class="loading">加载中…</div>';
  try {
    if (S.view === 'overview') await renderOverview(content);
    else if (S.view === 'orders') await renderOrders(content, 1);
    else if (S.view === 'users') await renderUsers(content, 1);
    else if (S.view === 'courses') await renderCourses(content);
  } catch (err) {
    content.innerHTML = '<div class="panel"><div class="empty">' + esc(err.message) + '</div></div>';
  }
}

/* ---------- 概览 ---------- */
async function renderOverview(el){
  const d = await api('/admin/overview');
  const max = Math.max(1, ...d.trend.map(t => t.revenue));
  const bars = d.trend.map(t => {
    const h = Math.max(2, Math.round(t.revenue / max * 100));
    return '<div class="col" title="' + t.date + ' · ' + money(t.revenue) + ' · ' + t.orders + ' 单">' +
      '<div class="val">' + (t.revenue ? Math.round(t.revenue / 100) / 10 + 'k' : '') + '</div>' +
      '<div class="bar" style="height:' + h + '%"></div><div class="d">' + t.date + '</div></div>';
  }).join('');

  const rows = d.latest.map(o => '<tr>' +
    '<td class="hide-sm mono muted">' + esc(o.id.slice(-8)) + '</td>' +
    '<td><div class="thumb">' + esc(o.userName) + '</div><div class="sub mono">' + esc(o.phone) + '</div></td>' +
    '<td class="mono">' + esc(o.productKey) + '</td>' +
    '<td class="money mono">' + money(o.amount) + '</td>' +
    '<td><span class="tag ' + o.status + '">' + statusText(o.status) + '</span></td>' +
    '<td class="muted mono hide-sm">' + shortDate(o.createdAt) + '</td></tr>').join('');

  el.innerHTML =
    '<div class="stats">' +
      '<div class="stat hi"><div class="k">累计营收</div><div class="v mono">' + money(d.revenue) + '</div><div class="s">已支付订单 ' + d.paidOrders + ' 笔</div></div>' +
      '<div class="stat"><div class="k">今日营收</div><div class="v mono">' + money(d.todayRevenue) + '</div><div class="s">今日 ' + d.todayOrders + ' 笔</div></div>' +
      '<div class="stat"><div class="k">注册学员</div><div class="v mono">' + d.users + '</div><div class="s">含管理员账号</div></div>' +
      '<div class="stat"><div class="k">在售课程</div><div class="v mono">' + d.courses + '</div><div class="s">认证 + 职场</div></div>' +
    '</div>' +
    '<div class="panel"><div class="panel-head"><div class="t">近 14 天营收</div><div class="m mono">单位：元</div></div>' +
      '<div class="panel-body"><div class="chart">' + bars + '</div></div></div>' +
    '<div class="panel"><div class="panel-head"><div class="t">最新订单</div><div class="m">点击左侧「订单管理」查看全部</div></div>' +
      '<table><thead><tr><th class="hide-sm">订单号</th><th>学员</th><th>商品</th><th>金额</th><th>状态</th><th class="hide-sm">时间</th></tr></thead>' +
      '<tbody>' + (rows || '<tr><td colspan="6" class="empty">暂无订单</td></tr>') + '</tbody></table></div>';
}

function statusText(s){ return s === 'paid' ? '已支付' : s === 'refunded' ? '已退款' : '待支付'; }

/* ---------- 订单 ---------- */
async function renderOrders(el, page){
  const status = S.ordersStatus || '';
  const q = S.ordersQuery || '';
  const d = await api('/admin/orders?page=' + page + '&size=20&status=' + encodeURIComponent(status) + '&q=' + encodeURIComponent(q));

  const rows = d.orders.map(o => '<tr>' +
    '<td class="hide-sm mono muted">' + esc(o.id) + '</td>' +
    '<td><div class="thumb">' + esc(o.userName) + '</div><div class="sub mono">' + esc(o.phone) + '</div></td>' +
    '<td class="mono">' + esc(o.productKey) + (o.plan ? '<div class="sub">' + esc(o.plan) + '</div>' : '') + '</td>' +
    '<td class="money mono">' + money(o.amount) + '</td>' +
    '<td><span class="tag ' + o.status + '">' + statusText(o.status) + '</span></td>' +
    '<td class="muted hide-sm">' + esc(o.method || '—') + '</td>' +
    '<td class="muted mono hide-sm">' + dt(o.paidAt || o.createdAt) + '</td>' +
    '<td>' + (o.status === 'paid' ? '<button class="btn btn-ghost btn-sm" data-refund="' + esc(o.id) + '">退款</button>' : '—') + '</td>' +
  '</tr>').join('');

  const pages = Math.max(1, Math.ceil(d.total / d.size));

  el.innerHTML =
    '<div class="panel">' +
      '<div class="toolbar">' +
        '<input id="orderQ" placeholder="搜索手机号 / 昵称 / 订单号" value="' + esc(q) + '">' +
        '<select id="orderStatus">' +
          ['', 'paid', 'pending', 'refunded'].map(v => '<option value="' + v + '"' + (v === status ? ' selected' : '') + '>' + (v === '' ? '全部状态' : statusText(v)) + '</option>').join('') +
        '</select>' +
        '<button class="btn btn-dark btn-sm" id="orderSearch">查询</button>' +
        '<span class="count mono">共 ' + d.total + ' 笔</span>' +
      '</div>' +
      '<table><thead><tr><th class="hide-sm">订单号</th><th>学员</th><th>商品</th><th>金额</th><th>状态</th><th class="hide-sm">方式</th><th class="hide-sm">时间</th><th>操作</th></tr></thead>' +
      '<tbody>' + (rows || '<tr><td colspan="8" class="empty">没有匹配的订单</td></tr>') + '</tbody></table>' +
      '<div class="pager"><span>第 ' + page + ' / ' + pages + ' 页</span><div class="btns">' +
        '<button data-page="' + (page - 1) + '"' + (page <= 1 ? ' disabled' : '') + '>上一页</button>' +
        '<button data-page="' + (page + 1) + '"' + (page >= pages ? ' disabled' : '') + '>下一页</button>' +
      '</div></div>' +
    '</div>';

  el.querySelector('#orderSearch').addEventListener('click', () => {
    S.ordersQuery = el.querySelector('#orderQ').value.trim();
    S.ordersStatus = el.querySelector('#orderStatus').value;
    renderOrders(el, 1);
  });
  el.querySelector('#orderQ').addEventListener('keydown', (e) => { if (e.key === 'Enter') el.querySelector('#orderSearch').click(); });
  el.querySelector('#orderStatus').addEventListener('change', () => {
    S.ordersStatus = el.querySelector('#orderStatus').value;
    renderOrders(el, 1);
  });
  el.querySelectorAll('[data-page]').forEach(b => b.addEventListener('click', () => renderOrders(el, Number(b.dataset.page))));
  el.querySelectorAll('[data-refund]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('确认对该订单退款？退款后学员将失去对应课程权益。')) return;
    b.disabled = true;
    try {
      await api('/admin/orders/' + encodeURIComponent(b.dataset.refund) + '/refund', { method: 'POST', body: {} });
      toast('已退款');
      renderOrders(el, page);
    } catch (err) {
      toast(err.message);
      b.disabled = false;
    }
  }));
}

/* ---------- 学员 ---------- */
async function renderUsers(el, page){
  const q = S.usersQuery || '';
  const d = await api('/admin/users?page=' + page + '&size=20&q=' + encodeURIComponent(q));
  const rows = d.users.map(u => '<tr>' +
    '<td><div class="thumb">' + esc(u.name) + (u.role === 'admin' ? ' <span class="tag cert">管理员</span>' : '') + '</div><div class="sub mono">' + esc(u.phone) + '</div></td>' +
    '<td class="mono">' + u.paidCount + '</td>' +
    '<td class="money mono">' + money(u.spent) + '</td>' +
    '<td class="muted mono hide-sm">' + dt(u.createdAt) + '</td>' +
  '</tr>').join('');
  const pages = Math.max(1, Math.ceil(d.total / d.size));

  el.innerHTML =
    '<div class="panel">' +
      '<div class="toolbar"><input id="userQ" placeholder="搜索手机号 / 昵称" value="' + esc(q) + '">' +
        '<button class="btn btn-dark btn-sm" id="userSearch">查询</button>' +
        '<span class="count mono">共 ' + d.total + ' 人</span></div>' +
      '<table><thead><tr><th>学员</th><th>已购课程</th><th>累计消费</th><th class="hide-sm">注册时间</th></tr></thead>' +
      '<tbody>' + (rows || '<tr><td colspan="4" class="empty">暂无学员</td></tr>') + '</tbody></table>' +
      '<div class="pager"><span>第 ' + page + ' / ' + pages + ' 页</span><div class="btns">' +
        '<button data-page="' + (page - 1) + '"' + (page <= 1 ? ' disabled' : '') + '>上一页</button>' +
        '<button data-page="' + (page + 1) + '"' + (page >= pages ? ' disabled' : '') + '>下一页</button>' +
      '</div></div>' +
    '</div>';

  el.querySelector('#userSearch').addEventListener('click', () => { S.usersQuery = el.querySelector('#userQ').value.trim(); renderUsers(el, 1); });
  el.querySelector('#userQ').addEventListener('keydown', (e) => { if (e.key === 'Enter') el.querySelector('#userSearch').click(); });
  el.querySelectorAll('[data-page]').forEach(b => b.addEventListener('click', () => renderUsers(el, Number(b.dataset.page))));
}

/* ---------- 课程 ---------- */
async function renderCourses(el){
  const q = S.coursesQuery || '';
  const d = await api('/admin/courses?q=' + encodeURIComponent(q));
  const rows = d.courses.map(c => '<tr>' +
    '<td><div class="thumb">' + esc(c.title) + '</div><div class="sub mono">' + esc(c.key) + ' · ' + esc(c.field) + '</div></td>' +
    '<td><span class="tag ' + c.kind + '">' + (c.kind === 'cert' ? '认证' : '职场') + '</span></td>' +
    '<td class="mono muted">' + c.lessonCount + ' 节</td>' +
    '<td><input class="price-input mono" value="' + c.price + '" data-price="' + esc(c.key) + '" inputmode="numeric"></td>' +
    '<td class="mono">' + c.sold + '</td>' +
    '<td><label class="switch"><input type="checkbox" data-enabled="' + esc(c.key) + '"' + (c.enabled ? ' checked' : '') + '><i></i></label></td>' +
    '<td><button class="btn btn-ghost btn-sm" data-save="' + esc(c.key) + '">保存</button></td>' +
  '</tr>').join('');

  el.innerHTML =
    '<div class="panel">' +
      '<div class="toolbar"><input id="courseQ" placeholder="搜索课程名称 / key" value="' + esc(q) + '">' +
        '<button class="btn btn-dark btn-sm" id="courseSearch">查询</button>' +
        '<span class="count mono">共 ' + d.courses.length + ' 门</span></div>' +
      '<table><thead><tr><th>课程</th><th>类型</th><th>课时</th><th>价格（元）</th><th>已售</th><th>上架</th><th>操作</th></tr></thead>' +
      '<tbody>' + (rows || '<tr><td colspan="7" class="empty">没有匹配的课程</td></tr>') + '</tbody></table>' +
    '</div>' +
    '<div class="hint" style="text-align:left;color:var(--muted)">修改价格或上架状态后点击「保存」生效；前台刷新即更新。</div>';

  el.querySelector('#courseSearch').addEventListener('click', () => { S.coursesQuery = el.querySelector('#courseQ').value.trim(); renderCourses(el); });
  el.querySelector('#courseQ').addEventListener('keydown', (e) => { if (e.key === 'Enter') el.querySelector('#courseSearch').click(); });

  el.querySelectorAll('[data-save]').forEach(b => b.addEventListener('click', async () => {
    const key = b.dataset.save;
    const row = b.closest('tr');
    const price = Number(row.querySelector('[data-price]').value || 0);
    const enabled = row.querySelector('[data-enabled]').checked;
    b.disabled = true;
    try {
      await api('/admin/courses/' + encodeURIComponent(key), { method: 'PATCH', body: { price, enabled } });
      toast('已保存：' + key);
    } catch (err) {
      toast(err.message);
    } finally {
      b.disabled = false;
    }
  }));
}

/* ---------- 启动 ---------- */
async function boot(){
  if (!S.token) return;
  try {
    const me = await api('/auth/me');
    if (!me.user || me.user.role !== 'admin') throw new Error('no');
    S.admin = me.user;
    enterApp();
  } catch {
    logout();
  }
}
boot();
</script>
